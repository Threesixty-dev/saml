[package]
name = "saml-lsp"
version = "0.3.6"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomic-write-file = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
ring = "0.17"
base64 = "0.23"
semver = "1"
