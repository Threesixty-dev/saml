[package]
name = "saml-lsp"
version = "0.3.7"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomic-write-file = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std"] }
ring = "0.17"
base64 = "0.23"
semver = "1"
